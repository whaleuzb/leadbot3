<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>
text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes br{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes rin{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes form{0%{transform:scaleY(0);opacity:0}2%{opacity:1}9%{transform:scaleY(1);opacity:1}88%{transform:scaleY(1);opacity:1}96%,100%{transform:scaleY(1);opacity:0}}
@keyframes tick{0%,8%{opacity:0;transform:scale(.4)}14%{opacity:1;transform:scale(1.15)}18%,88%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(1)}}
@keyframes ring{0%,6%{stroke-dashoffset:1}62%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
@keyframes prog{0%,6%{transform:scaleX(0)}62%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes play{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.row{animation:rin .8s cubic-bezier(.2,.8,.2,1) both}
.cd,.glow,.tick,.pl{transform-box:fill-box}
.cd{animation:form 6s cubic-bezier(.25,.8,.25,1) infinite both}
.tick{transform-origin:50% 50%;opacity:0;animation:tick 8s cubic-bezier(.2,.8,.2,1) infinite}
.chip{animation:flo 4.5s ease-in-out infinite}
.glow{transform-origin:50% 50%;animation:br 6s ease-in-out infinite}
.ring{stroke-dasharray:1;stroke-dashoffset:1;animation:ring 8s cubic-bezier(.4,0,.2,1) infinite}
.prog{transform-box:fill-box;transform-origin:0 50%;animation:prog 8s cubic-bezier(.4,0,.2,1) infinite}
.pl{transform-origin:50% 50%;animation:play 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tick{opacity:1}.ring{stroke-dashoffset:0}.prog{transform:none}}
</style><clipPath id="vb"><rect width="1200" height="675"/></clipPath><g clip-path="url(#vb)"><defs>
<radialGradient id="bg" cx="70%" cy="20%" r="95%"><stop offset="0" stop-color="#3a2f52"/><stop offset=".55" stop-color="#1d1828"/><stop offset="1" stop-color="#110e17"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a697eb" stop-opacity=".35"/><stop offset="1" stop-color="#a697eb" stop-opacity="0"/></radialGradient>
</defs>
