<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>
text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes br{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes form{0%{transform:scaleY(0);opacity:0}2%{opacity:1}9%{transform:scaleY(1);opacity:1}88%{transform:scaleY(1);opacity:1}96%,100%{transform:scaleY(1);opacity:0}}
@keyframes tick{0%,6%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.15)}16%,90%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
@keyframes bad{0%,8%{opacity:0}12%,44%{opacity:1}50%,100%{opacity:0}}
@keyframes good{0%,48%{opacity:0;transform:scale(.4)}54%{opacity:1;transform:scale(1.15)}58%,90%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}
@keyframes stopmv{0%,40%{transform:translateY(-38px)}52%,92%{transform:none}100%{transform:translateY(-38px)}}
@keyframes say{0%,30%{opacity:0;transform:translateY(8px) scale(.9)}38%,80%{opacity:1;transform:none}88%,100%{opacity:0}}
@keyframes nod{0%,100%{transform:none}50%{transform:translateY(3px)}}
@keyframes hl{0%,100%{opacity:.25}50%{opacity:.6}}
.cd,.glow,.tick,.good,.say,.nod{transform-box:fill-box}
.cd{animation:form 8s cubic-bezier(.25,.8,.25,1) infinite both}
.tick{transform-origin:50% 50%;opacity:0;animation:tick 8s cubic-bezier(.2,.8,.2,1) infinite}
.bad{opacity:0;animation:bad 8s ease infinite}
.good{transform-origin:50% 50%;opacity:0;animation:good 8s cubic-bezier(.2,.8,.2,1) infinite}
.stop{animation:stopmv 8s cubic-bezier(.4,0,.2,1) infinite}
.say{transform-origin:0 100%;opacity:0;animation:say 8s ease infinite}
.nod{animation:nod 2.8s ease-in-out infinite}
.zone{animation:hl 3s ease-in-out infinite}
.chip{animation:flo 4.5s ease-in-out infinite}
.glow{transform-origin:50% 50%;animation:br 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tick,.good,.say{opacity:1}.bad{opacity:0}}
</style><clipPath id="vb"><rect width="1200" height="675"/></clipPath><g clip-path="url(#vb)"><defs>
