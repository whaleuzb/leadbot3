<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1000" viewBox="0 0 620 1000"><style>
text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}
@keyframes grow{from{transform:scaleY(.05);opacity:0}to{transform:none;opacity:1}}
@keyframes live{0%,100%{transform:none}50%{transform:scaleY(1.22)}}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes br{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes march{to{stroke-dashoffset:-60}}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}38%{stroke-dashoffset:0}86%{stroke-dashoffset:0;opacity:1}96%{opacity:0}100%{stroke-dashoffset:1;opacity:0}}
@keyframes bob{0%,100%{transform:none}50%{transform:scaleY(.72)}}
@keyframes dp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes hl{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rin{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes bobx{0%,100%{transform:none}50%{transform:scaleX(.78)}}
.row{animation:rin .8s cubic-bezier(.2,.8,.2,1) both}
.barx{transform-box:fill-box;animation:bobx 2.6s ease-in-out infinite}
.cd,.bar,.dot,.glow{transform-box:fill-box}
.cd{transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.cd.live{transform-origin:50% 50%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both,live 1.8s ease-in-out 1.6s infinite}
.chip{animation:flo 4.5s ease-in-out infinite}
.glow{transform-origin:50% 50%;animation:br 6s ease-in-out infinite}
.dash{animation:march 3.2s linear infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 8s cubic-bezier(.4,0,.2,1) .3s infinite}
.bar{transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
.dot{transform-origin:50% 50%;animation:dp 2.2s ease-in-out infinite}
.hl{animation:hl 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dasharray:none;stroke-dashoffset:0}}
