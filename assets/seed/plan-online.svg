<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>
text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes br{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes form{0%{transform:scaleY(0);opacity:0}2%{opacity:1}9%{transform:scaleY(1);opacity:1}88%{transform:scaleY(1);opacity:1}96%,100%{transform:scaleY(1);opacity:0}}
@keyframes draw{0%,30%{stroke-dashoffset:1}48%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:1}}
@keyframes draw2{0%,48%{stroke-dashoffset:1}64%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:1}}
@keyframes cur{0%,14%{transform:translate(420px,40px)}30%{transform:translate(0,0)}46%{transform:translate(0,0)}64%{transform:translate(330px,-190px)}88%{transform:translate(330px,-190px)}100%{transform:translate(420px,40px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes sig{0%,4%{opacity:0;transform:translateX(24px)}10%,86%{opacity:1;transform:none}94%,100%{opacity:0}}
@keyframes talk{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.cd,.glow,.bar{transform-box:fill-box}
.cd{animation:form 8s cubic-bezier(.25,.8,.25,1) infinite both}
.d1{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 8s cubic-bezier(.4,0,.2,1) infinite}
.d2{stroke-dasharray:1;stroke-dashoffset:1;animation:draw2 8s cubic-bezier(.4,0,.2,1) infinite}
.cur{animation:cur 8s cubic-bezier(.45,0,.25,1) infinite}
.live{animation:live 1.4s ease-in-out infinite}
.sig{opacity:0;animation:sig 8s cubic-bezier(.2,.8,.2,1) infinite}
.bar{transform-origin:50% 50%;animation:talk .9s ease-in-out infinite}
.chip{animation:flo 4.5s ease-in-out infinite}
.glow{transform-origin:50% 50%;animation:br 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.d1,.d2{stroke-dashoffset:0}.sig{opacity:1}}
</style><clipPath id="vb"><rect width="1200" height="675"/></clipPath><g clip-path="url(#vb)"><defs>
