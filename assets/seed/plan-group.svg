<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>
text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes br{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes form{0%{transform:scaleY(0);opacity:0}2%{opacity:1}9%{transform:scaleY(1);opacity:1}88%{transform:scaleY(1);opacity:1}96%,100%{transform:scaleY(1);opacity:0}}
@keyframes draw{0%,10%{stroke-dashoffset:1}55%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
@keyframes bub{0%,4%{opacity:0;transform:translateY(10px) scale(.6)}10%{opacity:1;transform:none}30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes sit{0%,100%{transform:none}50%{transform:translateY(-3px)}}
@keyframes point{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
@keyframes hl{0%,100%{opacity:.25}50%{opacity:.7}}
.cd,.glow,.bub,.sit{transform-box:fill-box}
.cd{animation:form 8s cubic-bezier(.25,.8,.25,1) infinite both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 8s cubic-bezier(.4,0,.2,1) infinite}
.bub{transform-origin:50% 100%;opacity:0;animation:bub 7.8s ease-out infinite}
.sit{animation:sit 3.4s ease-in-out infinite}
.pointer{transform-origin:1010px 300px;animation:point 3s ease-in-out infinite}
.zone{animation:hl 3s ease-in-out infinite}
.chip{animation:flo 4.5s ease-in-out infinite}
.glow{transform-origin:50% 50%;animation:br 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.bub{opacity:1}}
</style><clipPath id="vb"><rect width="1200" height="675"/></clipPath><g clip-path="url(#vb)"><defs>
