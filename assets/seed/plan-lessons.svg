<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><style>
text{font-family:Arial,Helvetica,"Liberation Sans",sans-serif}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes br{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes rin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes prog{0%,6%{transform:scaleX(0)}50%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes tick{0%,6%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.15)}16%,88%{opacity:1;transform:scale(1)}96%,100%{opacity:0}}
@keyframes play{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes hl{0%,100%{stroke-opacity:.08}50%{stroke-opacity:.5}}
.mod{animation:rin .8s cubic-bezier(.2,.8,.2,1) both}
.prog,.tick,.done,.glow,.pl{transform-box:fill-box}
.prog{transform-origin:0 50%;animation:prog 8s cubic-bezier(.4,0,.2,1) infinite}
.tick,.done{transform-origin:50% 50%;opacity:0;animation:tick 8s cubic-bezier(.2,.8,.2,1) infinite}
.pl{transform-origin:50% 50%;animation:play 2.4s ease-in-out infinite}
.task{animation:hl 3s ease-in-out infinite}
.chip{animation:flo 4.5s ease-in-out infinite}
.glow{transform-origin:50% 50%;animation:br 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tick,.done{opacity:1}.prog{transform:none}}
</style><clipPath id="vb"><rect width="1200" height="675"/></clipPath><g clip-path="url(#vb)"><defs>
